name: FPL Price Predictor

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests

      # -------------------------
      # DATA COLLECTION
      # -------------------------
      - name: Snapshot FPL
        run: python scripts/snapshot.py

      - name: Record price changes
        run: python scripts/record_price_changes.py

      # -------------------------
      # TONIGHT
      # -------------------------
      - name: Predict tonight
        run: python scripts/predict.py

      - name: Daily summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/daily_summary.py

      # -------------------------
      # EVALUATION
      # -------------------------
      - name: Evaluate resolved predictions
        run: python scripts/evaluate.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit data
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add data
            git commit -m "Automated FPL update"
            git push
          else
            echo "No data changes"
          fi
