name: FPL Price Predictor

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout repository
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Setup Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # Install dependencies
      # -------------------------
      - name: Install dependencies
        run: |
          pip install pandas numpy requests

      # -------------------------
      # Configure git identity
      # -------------------------
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # =========================
      # DATA PIPELINE (ORDER MATTERS)
      # =========================

      # 1️⃣ Snapshot must ALWAYS run first
      - name: Snapshot FPL data
        run: python scripts/snapshot.py

      # 2️⃣ Record price changes (uses snapshots)
      - name: Record price changes
        run: python scripts/record_price_changes.py

      # 3️⃣ Predict (uses latest.csv only)
      - name: Predict prices
        run: python scripts/predict.py

      # 4️⃣ Daily summary (Telegram-facing)
      - name: Daily summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/daily_summary.py

      # 5️⃣ Evaluation (D → D+1 only)
      - name: Evaluate predictions
        run: python scripts/evaluate.py

      # -------------------------
      # Commit & Push generated data
      # -------------------------
      - name: Commit generated data
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add data
            git commit -m "Automated FPL predictor update"
            git push origin main
          else
            echo "No data changes"
          fi
